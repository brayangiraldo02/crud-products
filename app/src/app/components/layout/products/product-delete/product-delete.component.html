<h2 mat-dialog-title>Eliminar Producto {{data.id}}</h2>
<mat-dialog-content>¿Está seguro de eliminar el producto {{data.name}}?</mat-dialog-content>
<mat-dialog-actions>
  <button mat-button cdkFocusInitial [mat-dialog-close]="true">Eliminar</button>
  <button mat-button mat-dialog-close>Cerrar</button>
</mat-dialog-actions>
